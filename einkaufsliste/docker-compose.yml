services:
  einkaufsliste:
    build: .
    container_name: einkaufsliste
    restart: unless-stopped

    # Als tristans laufen, damit data/ und export/ ihm gehören: sonst schreibt
    # root in den Arbeitsbaum und weder Editor noch `git checkout` kommen an die
    # Dateien heran.
    user: "1000:1000"

    volumes:
      # Die Einkaufslisten selbst …
      - ./data:/app/data
      # … und Katalog, Märkte und Rezeptbuch – die drei Dateien im git
      - ./export:/app/export

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
