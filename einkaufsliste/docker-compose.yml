services:
  einkaufsliste:
    build: .
    container_name: einkaufsliste
    restart: unless-stopped

    volumes:
      # Der Live-Stand (Listen, Katalog, Märkte) …
      - ./data:/app/data
      # … und die Kopie von Katalog und Märkten, die im git liegt
      - ./export:/app/export

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
