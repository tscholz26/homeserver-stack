services:
  fahrradtracker:
    build: .
    container_name: fahrradtracker
    restart: unless-stopped

    # Als tristans laufen, damit data/ und backups/ ihm gehören: sonst schreibt
    # root in den Arbeitsbaum und weder Editor noch Backup-Sync kommen an die
    # Dateien heran.
    user: "1000:1000"

    # WAHOO_CLIENT_ID, WAHOO_CLIENT_SECRET und WAHOO_WEBHOOK_TOKEN aus der
    # Wahoo-Developer-App, dazu PUBLIC_URL – siehe .env.example
    env_file:
      - .env

    environment:
      # Wahoo liefert Startzeiten in UTC; die Nutzungszeiträume der Teile sind
      # Kalendertage. Ohne die Zeitzone landete eine Fahrt am späten Abend auf
      # dem falschen Tag.
      TZ: Europe/Berlin

    volumes:
      # Profile, Räder, Teile und die geholten Fahrten …
      - ./data:/app/data
      # … und der tägliche Schnappschuss davon
      - ./backups:/app/backups

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
