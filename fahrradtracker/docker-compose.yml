services:
  fahrradtracker:
    build: .
    container_name: fahrradtracker
    restart: unless-stopped

    # Als tristans laufen, damit data/ und backups/ ihm gehören: sonst schreibt
    # root in den Arbeitsbaum und weder Editor noch Backup-Sync kommen an die
    # Dateien heran.
    user: "1000:1000"

    # Zugangsdaten der Quellen (Wahoo, optional Intervals.icu), der SMTP-Zugang
    # für Benachrichtigungen und PUBLIC_URL – siehe .env.example
    env_file:
      - .env

    environment:
      # Die Nutzungszeiträume von Rädern und Teilen sind Kalendertage. Ohne
      # gesetzte Zeitzone landete eine Fahrt am späten Abend auf dem falschen
      # Tag – und damit womöglich am falschen Rad.
      TZ: Europe/Berlin

    volumes:
      # Profile, Räder, Teile und die geholten Fahrten …
      - ./data:/app/data
      # … und der tägliche Schnappschuss davon
      - ./backups:/app/backups

    networks:
      - caddy-network

networks:
  caddy-network:
    external: true
